services:
  redroid:
    image: redroid/redroid:15.0.0-latest
    restart: unless-stopped
    privileged: true
    command:
      - androidboot.use_memfd=true
      - androidboot.redroid_gpu_mode=guest
    volumes:
      - 'redroid-data:/data'

  web:
    build: .
    restart: unless-stopped
    init: true
    environment:
      - ADB_DEVICE=redroid:5555
    depends_on:
      - redroid

  proxy:
    build:
      context: .
      dockerfile: proxy.Dockerfile
    restart: unless-stopped
    expose:
      - '80'
    environment:
      - BASIC_AUTH_USERNAME=${BASIC_AUTH_USERNAME:?required}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH:?required}
    depends_on:
      - web

volumes:
  redroid-data:
