services:
  gitea-mirror:
    image: ghcr.io/raylabshq/gitea-mirror:latest
    restart: unless-stopped
    pull_policy: always
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?required}
      BETTER_AUTH_URL: ${GITEA_MIRROR_URL:?required}
      PUBLIC_BETTER_AUTH_URL: ${GITEA_MIRROR_URL:?required}
      BETTER_AUTH_TRUSTED_ORIGINS: ${GITEA_MIRROR_URL:?required}
      GITHUB_USERNAME: ${GITHUB_USERNAME:?required}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?required}
      GITEA_URL: ${GITEA_URL:?required}
      GITEA_USERNAME: ${GITEA_USERNAME:?required}
      GITEA_TOKEN: ${GITEA_TOKEN:?required}
      PRIVATE_REPOSITORIES: ${PRIVATE_REPOSITORIES:-true}
      PUBLIC_REPOSITORIES: ${PUBLIC_REPOSITORIES:-true}
      MIRROR_STARRED: ${MIRROR_STARRED:-true}
      AUTO_MIRROR_STARRED: ${AUTO_MIRROR_STARRED:-true}
      STARRED_REPOS_MODE: ${STARRED_REPOS_MODE:-preserve-owner}
      GITEA_ORG_VISIBILITY: ${GITEA_ORG_VISIBILITY:-private}
      GITEA_CREATE_ORG: ${GITEA_CREATE_ORG:-true}
      GITEA_ADD_TOPICS: ${GITEA_ADD_TOPICS:-true}
      SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-true}
      SCHEDULE_INTERVAL: "${SCHEDULE_INTERVAL:-0 * * * *}"
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-Asia/Saigon}
      SCHEDULE_BATCH_SIZE: ${SCHEDULE_BATCH_SIZE:-5}
      AUTO_MIRROR_REPOS: ${AUTO_MIRROR_REPOS:-true}
      CLEANUP_ENABLED: ${CLEANUP_ENABLED:-true}
      CLEANUP_DELETE_IF_NOT_IN_GITHUB: ${CLEANUP_DELETE_IF_NOT_IN_GITHUB:-true}
      BUN_CONFIG_HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-3600}
    volumes:
      - gitea-mirror-data:/app/data
    healthcheck:
      interval: 5m
      start_period: 30s
      start_interval: 5s

volumes:
  gitea-mirror-data:
