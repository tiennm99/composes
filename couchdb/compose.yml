services:
  couchdb:
    build: .
    restart: unless-stopped
    environment:
      - COUCHDB_USER=${COUCHDB_USER:?required}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?required}
    expose:
      - '5984'
    volumes:
      - couchdb-data:/opt/couchdb/data
      - couchdb-config:/opt/couchdb/etc/local.d

volumes:
  couchdb-data:
  couchdb-config:
