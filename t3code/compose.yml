services:
  t3code:
    build: .
    restart: unless-stopped
    init: true
    hostname: ${SERVICE_HOSTNAME}
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - GIT_AUTHOR_NAME=${GIT_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_EMAIL}
      - HOST=${SERVICE_HOSTNAME}
      # - T3CODE_TELEMETRY_ENABLED=${T3CODE_TELEMETRY_ENABLED:-true}
    volumes:
      - 't3code-home:/home/ubuntu'
      - 't3code-workspace:/workspace'

  # Tailscale node that serves T3 Code over HTTPS on the tailnet.
  tunnel:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?required}
      - TS_AUTH_ONCE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=${TS_HOSTNAME:-t3code}
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - 'tunnel-state:/var/lib/tailscale'
    configs:
      - { source: tunnel_serve, target: /config/serve.json }

volumes:
  t3code-home:
  t3code-workspace:
  tunnel-state:

configs:
  tunnel_serve:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": { "/": { "Proxy": "http://t3code:3773" } }
          }
        }
      }
