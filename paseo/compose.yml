services:
  paseo:
    build: .
    hostname: ${PASEO_LABEL}
    environment:
      - TZ=${TZ}
      - SHELL=${SHELL}
      - PASEO_PASSWORD=${PASEO_PASSWORD}
      - PASEO_HOSTNAMES=${PASEO_HOSTNAMES}
      - PASEO_TRUSTED_PROXIES=${PASEO_TRUSTED_PROXIES}
      - AGENT_CLIS=${AGENT_CLIS}
      - GIT_AUTHOR_NAME=${GIT_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_EMAIL}
    volumes:
      - 'paseo-home:/home/paseo'
      - 'paseo-workspace:/workspace'
volumes:
  paseo-home:
  paseo-workspace:
