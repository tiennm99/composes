services:
  paseo:
    build: .
    hostname: ${PASEO_LABEL}
    environment:
      - TZ=${TZ}
      - PASEO_PASSWORD=${PASEO_PASSWORD}
      - PASEO_HOSTNAMES=${PASEO_HOSTNAMES}
      - PASEO_TRUSTED_PROXIES=${PASEO_TRUSTED_PROXIES}
    volumes:
      - 'paseo-home:/home/paseo'
      - 'paseo-workspace:/workspace'
volumes:
  paseo-home:
  paseo-workspace:
