services:
  openmausbot:
    build:
      context: .
      target: server
      args:
        ENGINES: ${ENGINES:-@anthropic-ai/claude-code @openai/codex}
    restart: unless-stopped
    init: true
    shm_size: 512m
    environment:
      - OMB_PUBLIC_URL=https://${TS_HOSTNAME:-openmausbot}.${TAILNET_DOMAIN:?required}
      - OMB_WEBHOOK_PUBLIC_URL=https://${TS_HOSTNAME:-openmausbot}.${TAILNET_DOMAIN:?required}
      - OMB_PORT=8799
      - OMB_WEBHOOK_PORT=8800
      # - OMB_SIGNIN_EMAILS=${OMB_SIGNIN_EMAILS:-}
      # - OMB_SIGNIN_MEMBER_EMAILS=${OMB_SIGNIN_MEMBER_EMAILS:-}
      # - OMB_SIGNIN_SMTP_URL=${OMB_SIGNIN_SMTP_URL:-}
      # - OMB_SIGNIN_SMTP_FROM=${OMB_SIGNIN_SMTP_FROM:-}
      # - OMB_SERVER_NAME=${OMB_SERVER_NAME:-openmausbot}
    volumes:
      - openmausbot-data:/data

  tunnel:
    build:
      context: .
      target: tunnel
    restart: unless-stopped
    network_mode: service:openmausbot
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?required}
      - TS_HOSTNAME=${TS_HOSTNAME:-openmausbot}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tunnel-state:/var/lib/tailscale
    depends_on:
      openmausbot:
        condition: service_healthy

volumes:
  openmausbot-data:
  tunnel-state:
