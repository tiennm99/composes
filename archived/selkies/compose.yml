services:
  selkies:
    image: ghcr.io/selkies-project/selkies/desktop:latest-ubuntu26.04
    restart: unless-stopped
    shm_size: 2gb
    environment:
      - PASSWD=${PASSWD:?required}
      - SELKIES_ENABLE_HTTPS=false
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - selkies-home:/home/ubuntu

volumes:
  selkies-home:
