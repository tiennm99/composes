services:
  selkies:
    build: .
    restart: unless-stopped
    shm_size: 2gb
    environment:
      - PASSWD=${PASSWD:?required}
      - SELKIES_ENABLE_HTTPS=false
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - selkies-home:/home/ubuntu
      - selkies-workspace:/workspace

volumes:
  selkies-home:
  selkies-workspace:
