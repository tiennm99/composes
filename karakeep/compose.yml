services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    restart: unless-stopped
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?required}
      - NEXTAUTH_URL=${NEXTAUTH_URL:?required}
      - MEILI_ADDR=http://search:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?required}
      - DISABLE_SIGNUPS=${DISABLE_SIGNUPS:-false}
      - BROWSER_WEB_URL=http://browser:9222
      - DATA_DIR=/data
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - INFERENCE_TEXT_MODEL=${INFERENCE_TEXT_MODEL:-gpt-6-luna}
      - INFERENCE_IMAGE_MODEL=${INFERENCE_IMAGE_MODEL:-gpt-4o-mini}
      - INFERENCE_MAX_OUTPUT_TOKENS=${INFERENCE_MAX_OUTPUT_TOKENS:-2048}
      - INFERENCE_JOB_TIMEOUT_SEC=${INFERENCE_JOB_TIMEOUT_SEC:-30}
      - NODE_OPTIONS=${NODE_OPTIONS:-}
      # - INFERENCE_LANG=${INFERENCE_LANG:-english}
      # - INFERENCE_ENABLE_AUTO_SUMMARIZATION=${INFERENCE_ENABLE_AUTO_SUMMARIZATION:-false}
      # - CRAWLER_FULL_PAGE_ARCHIVE=${CRAWLER_FULL_PAGE_ARCHIVE:-false}
      # - MAX_ASSET_SIZE_MB=${MAX_ASSET_SIZE_MB:-50}
    volumes:
      - karakeep-data:/data
    expose:
      - "3000"
    depends_on:
      - search
      - browser

  # Headless Chrome for crawling pages and taking screenshots.
  browser:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  # Meilisearch for full-text search.
  search:
    image: getmeili/meilisearch:v1.55.0
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?required}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - search-data:/meili_data

volumes:
  karakeep-data:
  search-data:
