services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    restart: unless-stopped
    environment:
      # Turns off sign-up on every start.
      GITLAB_POST_RECONFIGURE_SCRIPT: "gitlab-rails runner 'ApplicationSetting.current.update!(signup_enabled: false)'"
      # Omnibus settings, evaluated as Ruby on every start.
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL:?required}'
        gitlab_rails['nginx']['listen_port'] = 80
        gitlab_rails['nginx']['listen_https'] = false
        letsencrypt['enable'] = false
        gitlab_rails['time_zone'] = '${TZ:-UTC}'
        gitlab_rails['smtp_enable'] = ${GITLAB_SMTP_ENABLE:-false}
        gitlab_rails['smtp_address'] = '${GITLAB_SMTP_ADDRESS:-}'
        gitlab_rails['smtp_port'] = ${GITLAB_SMTP_PORT:-587}
        gitlab_rails['smtp_user_name'] = '${GITLAB_SMTP_USER_NAME:-}'
        gitlab_rails['smtp_password'] = ENV['GITLAB_SMTP_PASSWORD']
        gitlab_rails['smtp_domain'] = '${GITLAB_SMTP_DOMAIN:-}'
        gitlab_rails['smtp_authentication'] = 'login'
        gitlab_rails['smtp_enable_starttls_auto'] = ${GITLAB_SMTP_STARTTLS_AUTO:-true}
        gitlab_rails['smtp_tls'] = ${GITLAB_SMTP_TLS:-false}
        gitlab_rails['gitlab_email_from'] = '${GITLAB_EMAIL_FROM:-}'
        gitlab_rails['gitlab_email_reply_to'] = '${GITLAB_EMAIL_REPLY_TO:-}'
      GITLAB_SMTP_PASSWORD: ${GITLAB_SMTP_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: 256m

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
