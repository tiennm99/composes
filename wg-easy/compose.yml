services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    restart: unless-stopped
    environment:
      INIT_ENABLED: "${INIT_ENABLED:-true}"
      INIT_USERNAME: ${INIT_USERNAME:-admin}
      INIT_PASSWORD: ${INIT_PASSWORD:-}
      INIT_HOST: ${INIT_HOST:?required}
      INIT_PORT: "${INIT_PORT:-51820}"
      DISABLE_IPV6: "${DISABLE_IPV6:-true}"
      # INIT_DNS: "${INIT_DNS:-1.1.1.1,8.8.8.8}"
      # DISABLE_VERSION_CHECK: "${DISABLE_VERSION_CHECK:-false}"
    # WireGuard UDP port, published on the host.
    ports:
      - "${INIT_PORT:-51820}:${INIT_PORT:-51820}/udp"
    # Web UI, routed by the platform's proxy.
    expose:
      - "51821"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - wg-easy-data:/etc/wireguard
      - /lib/modules:/lib/modules:ro

volumes:
  wg-easy-data:
