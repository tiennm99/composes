services:
  orca:
    build: .
    restart: unless-stopped
    hostname: ${SERVICE_HOSTNAME}
    shm_size: 256m
    environment:
      - ORCA_PAIRING_ADDRESS=${ORCA_PAIRING_ADDRESS:?required}
      - ORCA_PAIRING=${ORCA_PAIRING:-runtime}
      - TZ=Asia/Ho_Chi_Minh
      - GIT_AUTHOR_NAME=${GIT_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_EMAIL}
      - HOST=${SERVICE_HOSTNAME}
    volumes:
      - 'orca-home:/home/ubuntu'
      - 'orca-workspace:/workspace'

  # Tailscale node that serves Orca over HTTPS on the tailnet.
  tunnel:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?required}
      - TS_AUTH_ONCE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=${TS_HOSTNAME:-orca}
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - 'tunnel-state:/var/lib/tailscale'
    configs:
      - { source: tunnel_serve, target: /config/serve.json }

volumes:
  orca-home:
  orca-workspace:
  tunnel-state:

configs:
  tunnel_serve:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": { "/": { "Proxy": "http://orca:6768" } }
          }
        }
      }
